      <span class="title"><span id="log-title">Process log</span></span>
      <span class="dotl" id="log-dot"></span>
      <span class="status ellipsis" id="log-status">Idle</span>
      <svg class="i chev"><use href="#i-up"/></svg>
    </button>
    <button class="badge logc warn" id="log-warn" hidden></button>
    <button class="badge logc err" id="log-err" hidden></button>
  </div>
  <div class="log-tools" id="log-tools">
    <div class="seg" role="group" id="log-filter" aria-label="Filter">
      <button data-f="all" aria-pressed="true">All</button><button data-f="problems" aria-pressed="false">Problems</button>

    <button class="btn sm ghost" id="log-clear"><svg class="i"><use href="#i-trash"/></svg><span class="lbl">Clear</span></button>
  </div>
  <div class="log-body" id="log-body" role="log" aria-live="off" tabindex="0"></div>
